databaseChangeLog:
  # ---------------------------------------------------------------------------
  # Placeholders. Migrations reference these instead of hardcoding names, so the
  # same file can run against prod and against a personal sandbox.
  # ---------------------------------------------------------------------------
  - property: {name: author_name, value: deployer}

  # Set to e.g. "leonid__" on preprod to get private copies of every object.
  - property: {name: personal_prefix, value: ""}

  # ReplicatedMergeTree ZooKeeper path + replica name. `{shard}` / `{replica}` are
  # ClickHouse macros (see clickhouse/macros/*.xml), not Liquibase ones.
  - property:
      name: sharded
      value: "'/clickhouse/tables/{shard}/{database}/{table}', '{replica}'"
  - property:
      name: sharded_uuid
      value: "'/clickhouse/tables/{shard}/{database}/{uuid}', '{replica}'"
  # Broadcast: every shard shares one ZK path, so the table is one cluster-wide copy
  # rather than a per-shard slice. {replica_broadcast} is unique across the cluster.
  - property:
      name: broadcast
      value: "'/clickhouse/tables/{shard_broadcast}/{database}/{table}', '{replica_broadcast}'"

  # Database shorthands on analytics_cluster: ${stage}events -> stage.events
  - property: {name: stage_schema, value: stage}
  - property: {name: stage, value: "${stage_schema}.${personal_prefix}"}
  - property: {name: bi_schema, value: bi}
  - property: {name: bi, value: "${bi_schema}.${personal_prefix}"}
  - property: {name: marts_schema, value: marts}
  - property: {name: marts, value: "${marts_schema}.${personal_prefix}"}

  # ---------------------------------------------------------------------------
  # One include per logical cluster.
  # ---------------------------------------------------------------------------
  - include:
      file: changelog/clusters/analytics_cluster/changelog.yaml
