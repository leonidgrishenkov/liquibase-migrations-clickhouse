# Read by the liquibase-clickhouse extension from /liquibase/lib/liquibaseClickhouse.conf.
# Without it the extension logs "Cluster settings are not defined. Work in single-instance
# clickhouse mode." and creates its tracking tables as plain MergeTree.
#
# Broadcast rather than sharded on purpose: DATABASECHANGELOG has to read identically
# from every node, so it must be one table replicated across the whole cluster rather
# than a per-shard slice. {shard_broadcast} is the same on every host, which puts all
# replicas on a single ZK path; {replica_broadcast} is therefore unique cluster-wide.
# Both macros are defined in clickhouse/config.d/02-clusters.xml.
cluster {
    clusterName="analytics_cluster"
    tableZooKeeperPathPrefix="/clickhouse/tables/{shard_broadcast}/{database}/"
    tableReplicaName="{replica_broadcast}"
}
