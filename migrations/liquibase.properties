# Everything Liquibase needs that is NOT a secret. Credentials come from the environment
# (see below); this file is safe to commit and a change to it is reviewable in git.
#
# The database in this URL is also what decides where DATABASECHANGELOG /
# DATABASECHANGELOGLOCK are created, and nothing else does. It points at a dedicated
# `liquibase` database, created by clickhouse/initdb/00-liquibase-metadata.sql - keep
# the two in sync. Migrations themselves are unaffected because every changeset writes
# fully-qualified DDL (${stage_schema}.orders, never bare `orders`).
# compress=0 is required: the v1 driver decodes HTTP responses as LZ4 by default and
# CH 26.3 answers uncompressed, which surfaces as
#   IOException: Magic is not correct - expect [-126] but got [123]
# Points at one specific node. Liquibase's tracking tables are plain MergeTree (cluster
# mode is broken, see README), so they live only on the node it connects to - always
# connect through the same one.
url: jdbc:clickhouse://ch-s1r1:8123/liquibase?compress=0
driver: com.clickhouse.jdbc.ClickHouseDriver

# No username/password here on purpose. They come from LIQUIBASE_COMMAND_USERNAME /
# LIQUIBASE_COMMAND_PASSWORD (compose.yaml, backed by .env). Committing defaults would
# also mean that dropping the env vars silently falls back to them instead of failing.

# changelogFile is resolved against searchPath, never as an absolute filesystem path.
searchPath: /liquibase
changelogFile: changelog/db.changelog-root.yaml
headless: true

# Tracking tables. The extension creates them itself, as MergeTree, in the database
# named in the URL. Uppercase names are the Liquibase default and ClickHouse is
# case-sensitive, so keep these two in sync with whatever already exists.
databaseChangeLogTableName: DATABASECHANGELOG
databaseChangeLogLockTableName: DATABASECHANGELOGLOCK

logLevel: INFO
