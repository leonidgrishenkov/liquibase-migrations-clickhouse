databaseChangeLog:
  # Touches a table Liquibase did not create - the case this repo is here to test.
  - changeSet:
      id: 002-users-add-lifetime-value
      author: leonid
      preConditions:
        - onFail: MARK_RAN
          not:
            - columnExists:
                tableName: users
                columnName: lifetime_value
      changes:
        - sql:
            sql: ALTER TABLE analytics.users ADD COLUMN IF NOT EXISTS lifetime_value Decimal(18, 4) DEFAULT 0
      rollback:
        - sql:
            sql: ALTER TABLE analytics.users DROP COLUMN IF EXISTS lifetime_value

  - changeSet:
      id: 002-events-add-skip-index
      author: leonid
      comment: ClickHouse-specific DDL that no portable change type covers.
      changes:
        - sql:
            sql: ALTER TABLE analytics.events ADD INDEX IF NOT EXISTS idx_user_id user_id TYPE minmax GRANULARITY 4
      rollback:
        - sql:
            sql: ALTER TABLE analytics.events DROP INDEX IF EXISTS idx_user_id
