# NOT included by db.changelog-root.yaml on purpose: this changelog is expected to fail.
# It shows what the extension does with Liquibase's portable <createTable>:
#
#   docker compose run --rm liquibase update \
#     --changelog-file=changelog/experiments/portable-create-table.yaml
#
# Generated SQL (as of extension 0.8.3):
#   CREATE TABLE analytics.feature_flags (flag_name STRING, enabled BOOLEAN, updated_at datetime)
#
# Two problems: the types are emitted in Liquibase's generic spelling rather than
# ClickHouse's, and there is no ENGINE / ORDER BY clause at all. ClickHouse rejects it
# with "Code: 50 ... Unknown data type family: STRING". Portable change types are not
# usable here - use raw <sql> for DDL.
databaseChangeLog:
  - changeSet:
      id: portable-create-feature-flags
      author: leonid
      changes:
        - createTable:
            tableName: feature_flags
            columns:
              - column:
                  name: flag_name
                  type: String
              - column:
                  name: enabled
                  type: Bool
              - column:
                  name: updated_at
                  type: DateTime
