version: "3"

# Liquibase/migration recipes live next to the migrations they operate on, in
# ./migrations/taskfile.yaml, and are exposed here under the `migrations:` namespace.
# No `dir:` on purpose - the included recipes still run from the repo root, where
# compose.yaml lives and their paths resolve.
includes:
  migrations:
    taskfile: ./migrations/taskfile.yaml
    vars:
      COMPOSE: "{{.COMPOSE}}"
      IMAGE_NAME: "{{.IMAGE_NAME}}"
      IMAGE_TAG: "{{.IMAGE_TAG}}"

# The CLI image is built and published by a separate repository:
#   https://github.com/leonidgrishenkov/liquibase-clickhouse-image
# This repo only ever consumes it by tag - there is no build task here on purpose.
vars:
  IMAGE_NAME: liquibase-clickhouse
  IMAGE_TAG: 4.33.0-1
  COMPOSE: docker compose
  CH: docker exec ch-s1r1 clickhouse-client --user liquibase --password liquibase

tasks:
  default:
    desc: List available tasks
    silent: true
    cmds:
      - task --list

  # --- environment ------------------------------------------------------------
  up:
    desc: Start the cluster and wait until it is bootstrapped
    cmds:
      # --wait returns once containers are healthy/running, which for a one-shot
      # service means it does NOT wait for bootstrap to finish. `compose wait` blocks
      # until it actually exits, so the databases and seed data are guaranteed to be
      # in place when this task returns.
      - "{{.COMPOSE}} up -d --wait"
      - "{{.COMPOSE}} wait bootstrap >/dev/null"

  down:
    desc: Stop containers, keep the data volume
    cmds:
      - "{{.COMPOSE}} down"

  nuke:
    desc: Stop containers AND drop the data volume (next `up` re-runs initdb)
    prompt: This deletes the ClickHouse data volume. Continue?
    cmds:
      - "{{.COMPOSE}} down -v"

  logs:
    desc: Tail logs from all four ClickHouse nodes
    cmds:
      - "{{.COMPOSE}} logs -f ch-s1r1 ch-s1r2 ch-s2r1 ch-s2r2"

  ch:
    desc: Interactive clickhouse-client on ch-s1r1
    interactive: true
    cmds:
      - docker exec -it ch-s1r1 clickhouse-client --user liquibase --password liquibase

  tables:
    desc: List tables in every migrated database
    cmds:
      - >-
        {{.CH}} --query
        "SELECT database, name, engine FROM system.tables
         WHERE database IN ('bi','marts','stage')
         ORDER BY database, name FORMAT PrettyCompact"

  ddl:
    desc: Show CREATE statements for every migrated table
    cmds:
      - >-
        {{.CH}} --query
        "SELECT create_table_query FROM system.tables
         WHERE database IN ('bi','marts','stage') ORDER BY database, name FORMAT TSVRaw"
