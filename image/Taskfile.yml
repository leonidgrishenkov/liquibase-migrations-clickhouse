version: "3"

# Stands in for the image repo's CI. In the real split this would be a GitHub Actions
# workflow publishing on tag, and consumers would only ever `docker pull`.

vars:
  IMAGE: '{{.IMAGE | default "liquibase-clickhouse"}}'
  TAG: '{{.TAG | default "4.33.0-1"}}'

tasks:
  default:
    desc: List available tasks
    silent: true
    cmds:
      - task --list

  build:
    desc: Build and tag the image
    cmds:
      - docker build -t {{.IMAGE}}:{{.TAG}} -t {{.IMAGE}}:latest .

  push:
    desc: Push the image (set IMAGE to a registry path first)
    preconditions:
      - sh: '[ "{{.IMAGE}}" != "liquibase-clickhouse" ]'
        msg: 'IMAGE is still the local name. Push with: task image:push IMAGE=ghcr.io/you/liquibase-clickhouse'
    cmds:
      - docker push {{.IMAGE}}:{{.TAG}}

  versions:
    desc: Show the versions baked into the image
    cmds:
      - docker run --rm --entrypoint sh {{.IMAGE}}:{{.TAG}} -c 'ls -1 /liquibase/lib/*.jar'
      - docker run --rm {{.IMAGE}}:{{.TAG}} --version | head -3
