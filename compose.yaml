name: liquibase-clickhouse

# A 2-shard x 2-replica ClickHouse cluster (4 servers + 1 Keeper), so ON CLUSTER DDL,
# ReplicatedMergeTree and Distributed tables all behave like they would in production
# rather than degenerating into no-ops on a single node.
#
#   analytics_cluster
#     shard 01 -> ch-s1r1, ch-s1r2
#     shard 02 -> ch-s2r1, ch-s2r2
#
# Only ch-s1r1 publishes ports to the host; it is the entry point for clickhouse-client
# and for Liquibase.

services:
  keeper:
    image: clickhouse/clickhouse-keeper:26.3.17.110
    container_name: keeper
    hostname: keeper
    volumes:
      - ./clickhouse/keeper/keeper_config.xml:/etc/clickhouse-keeper/keeper_config.xml:ro
      - keeper-data:/var/lib/clickhouse-keeper
    healthcheck:
      test: ["CMD-SHELL", "clickhouse-keeper-client -q 'get /keeper/api_version' >/dev/null 2>&1 || exit 1"]
      interval: 5s
      timeout: 3s
      retries: 30
      start_period: 15s

  ch-s1r1:
    image: clickhouse/clickhouse-server:26.3.17.110
    container_name: ch-s1r1
    hostname: ch-s1r1
    depends_on:
      keeper:
        condition: service_healthy
    environment:
      CLICKHOUSE_USER: ${CLICKHOUSE_USER:-liquibase}
      CLICKHOUSE_PASSWORD: ${CLICKHOUSE_PASSWORD:-liquibase}
      CLICKHOUSE_DEFAULT_ACCESS_MANAGEMENT: 1
    ports:
      - "8123:8123"   # HTTP  (JDBC talks to this one)
      - "9000:9000"   # native TCP (clickhouse-client)
    volumes:
      - ch-s1r1-data:/var/lib/clickhouse
      # Mounted file-by-file, NOT as a directory: the image ships its own
      # config.d/docker_related_config.xml (which sets listen_host to the wildcard
      # address). Mounting the whole directory shadows it and the server ends up
      # listening on loopback only, unreachable from the other containers.
      - ./clickhouse/config.d/00-cluster.xml:/etc/clickhouse-server/config.d/00-cluster.xml:ro
      - ./clickhouse/macros/s1r1.xml:/etc/clickhouse-server/config.d/01-macros.xml:ro
    ulimits:
      nofile:
        soft: 262144
        hard: 262144
    healthcheck:
      # Probes the container's own external address rather than localhost: the entrypoint
      # runs a temporary init server bound to loopback, so a localhost probe can report
      # healthy before the real server exists. JDBC also needs 8123, which comes up after
      # native 9000.
      test: ["CMD-SHELL", "wget -qO- http://$(hostname):8123/ping | grep -q Ok"]
      interval: 5s
      timeout: 3s
      retries: 30
      start_period: 30s

  ch-s1r2:
    image: clickhouse/clickhouse-server:26.3.17.110
    container_name: ch-s1r2
    hostname: ch-s1r2
    depends_on:
      keeper:
        condition: service_healthy
    environment:
      CLICKHOUSE_USER: ${CLICKHOUSE_USER:-liquibase}
      CLICKHOUSE_PASSWORD: ${CLICKHOUSE_PASSWORD:-liquibase}
      CLICKHOUSE_DEFAULT_ACCESS_MANAGEMENT: 1
    volumes:
      - ch-s1r2-data:/var/lib/clickhouse
      # Mounted file-by-file, NOT as a directory: the image ships its own
      # config.d/docker_related_config.xml (which sets listen_host to the wildcard
      # address). Mounting the whole directory shadows it and the server ends up
      # listening on loopback only, unreachable from the other containers.
      - ./clickhouse/config.d/00-cluster.xml:/etc/clickhouse-server/config.d/00-cluster.xml:ro
      - ./clickhouse/macros/s1r2.xml:/etc/clickhouse-server/config.d/01-macros.xml:ro
    ulimits:
      nofile:
        soft: 262144
        hard: 262144
    healthcheck:
      # Probes the container's own external address rather than localhost: the entrypoint
      # runs a temporary init server bound to loopback, so a localhost probe can report
      # healthy before the real server exists. JDBC also needs 8123, which comes up after
      # native 9000.
      test: ["CMD-SHELL", "wget -qO- http://$(hostname):8123/ping | grep -q Ok"]
      interval: 5s
      timeout: 3s
      retries: 30
      start_period: 30s

  ch-s2r1:
    image: clickhouse/clickhouse-server:26.3.17.110
    container_name: ch-s2r1
    hostname: ch-s2r1
    depends_on:
      keeper:
        condition: service_healthy
    environment:
      CLICKHOUSE_USER: ${CLICKHOUSE_USER:-liquibase}
      CLICKHOUSE_PASSWORD: ${CLICKHOUSE_PASSWORD:-liquibase}
      CLICKHOUSE_DEFAULT_ACCESS_MANAGEMENT: 1
    volumes:
      - ch-s2r1-data:/var/lib/clickhouse
      # Mounted file-by-file, NOT as a directory: the image ships its own
      # config.d/docker_related_config.xml (which sets listen_host to the wildcard
      # address). Mounting the whole directory shadows it and the server ends up
      # listening on loopback only, unreachable from the other containers.
      - ./clickhouse/config.d/00-cluster.xml:/etc/clickhouse-server/config.d/00-cluster.xml:ro
      - ./clickhouse/macros/s2r1.xml:/etc/clickhouse-server/config.d/01-macros.xml:ro
    ulimits:
      nofile:
        soft: 262144
        hard: 262144
    healthcheck:
      # Probes the container's own external address rather than localhost: the entrypoint
      # runs a temporary init server bound to loopback, so a localhost probe can report
      # healthy before the real server exists. JDBC also needs 8123, which comes up after
      # native 9000.
      test: ["CMD-SHELL", "wget -qO- http://$(hostname):8123/ping | grep -q Ok"]
      interval: 5s
      timeout: 3s
      retries: 30
      start_period: 30s

  ch-s2r2:
    image: clickhouse/clickhouse-server:26.3.17.110
    container_name: ch-s2r2
    hostname: ch-s2r2
    depends_on:
      keeper:
        condition: service_healthy
    environment:
      CLICKHOUSE_USER: ${CLICKHOUSE_USER:-liquibase}
      CLICKHOUSE_PASSWORD: ${CLICKHOUSE_PASSWORD:-liquibase}
      CLICKHOUSE_DEFAULT_ACCESS_MANAGEMENT: 1
    volumes:
      - ch-s2r2-data:/var/lib/clickhouse
      # Mounted file-by-file, NOT as a directory: the image ships its own
      # config.d/docker_related_config.xml (which sets listen_host to the wildcard
      # address). Mounting the whole directory shadows it and the server ends up
      # listening on loopback only, unreachable from the other containers.
      - ./clickhouse/config.d/00-cluster.xml:/etc/clickhouse-server/config.d/00-cluster.xml:ro
      - ./clickhouse/macros/s2r2.xml:/etc/clickhouse-server/config.d/01-macros.xml:ro
    ulimits:
      nofile:
        soft: 262144
        hard: 262144
    healthcheck:
      # Probes the container's own external address rather than localhost: the entrypoint
      # runs a temporary init server bound to loopback, so a localhost probe can report
      # healthy before the real server exists. JDBC also needs 8123, which comes up after
      # native 9000.
      test: ["CMD-SHELL", "wget -qO- http://$(hostname):8123/ping | grep -q Ok"]
      interval: 5s
      timeout: 3s
      retries: 30
      start_period: 30s

  # Applies clickhouse/initdb/*.sql ONCE, cluster-wide, after every node is healthy.
  # The image's own docker-entrypoint-initdb.d hook cannot be used here: it runs per
  # container, so all four nodes would race to execute the same ON CLUSTER DDL and the
  # seed INSERTs would run four times.
  bootstrap:
    image: clickhouse/clickhouse-server:26.3.17.110
    container_name: ch-bootstrap
    depends_on:
      ch-s1r1: {condition: service_healthy}
      ch-s1r2: {condition: service_healthy}
      ch-s2r1: {condition: service_healthy}
      ch-s2r2: {condition: service_healthy}
    environment:
      CLICKHOUSE_USER: ${CLICKHOUSE_USER:-liquibase}
      CLICKHOUSE_PASSWORD: ${CLICKHOUSE_PASSWORD:-liquibase}
    volumes:
      - ./clickhouse/initdb:/sql:ro
    entrypoint: ["/bin/bash", "-c"]
    command:
      - |
        set -euo pipefail
        for f in /sql/*.sql; do
          echo "bootstrap: applying $$(basename "$$f")"
          clickhouse-client --host ch-s1r1 \
            --user "$$CLICKHOUSE_USER" --password "$$CLICKHOUSE_PASSWORD" \
            --queries-file "$$f"
        done
        echo "bootstrap: done"
    restart: "no"

  liquibase:
    image: public.ecr.aws/a8c0b5z6/liquibase-clickhouse:4.33.0-1
    container_name: liquibase
    depends_on:
      ch-s1r1:
        condition: service_healthy
      bootstrap:
        condition: service_completed_successfully
    environment:
      # Credentials only. Environment variables outrank the defaults file in Liquibase's
      # precedence order, so anything set here silently wins over liquibase.properties -
      # keep that to values that must not be committed. The JDBC URL deliberately lives
      # in migrations/liquibase.properties instead, where it is reviewable in git.
      LIQUIBASE_COMMAND_USERNAME: ${CLICKHOUSE_USER:-liquibase}
      LIQUIBASE_COMMAND_PASSWORD: ${CLICKHOUSE_PASSWORD:-liquibase}
    volumes:
      - ./migrations/changelog:/liquibase/changelog
      # The image entrypoint always injects --defaultsFile=/liquibase/liquibase.docker.properties,
      # so that is the path our config has to land on.
      - ./migrations/liquibase.properties:/liquibase/liquibase.docker.properties:ro
      # NOTE: migrations/liquibaseClickhouse.conf is deliberately NOT mounted here.
      # Mounting it switches the extension into cluster mode, which is broken in this
      # combination - see `task migrations:demo-cluster-mode` and the README.
      # generate-changelog / diff-changelog write here
      - ./migrations/out:/liquibase/out
    working_dir: /liquibase
    # One-shot CLI container: `docker compose run --rm liquibase <command>`
    profiles: ["cli"]

volumes:
  keeper-data:
  ch-s1r1-data:
  ch-s1r2-data:
  ch-s2r1-data:
  ch-s2r2-data:
