name: liquibase-clickhouse

services:
  clickhouse:
    image: clickhouse/clickhouse-server:26.3.17.110
    container_name: clickhouse
    environment:
      CLICKHOUSE_USER: ${CLICKHOUSE_USER:-liquibase}
      CLICKHOUSE_PASSWORD: ${CLICKHOUSE_PASSWORD:-liquibase}
      # Lets the bootstrap user run GRANT/CREATE USER, handy while poking at the instance.
      CLICKHOUSE_DEFAULT_ACCESS_MANAGEMENT: 1
    ports:
      - "8123:8123"   # HTTP  (JDBC talks to this one)
      - "9000:9000"   # native TCP (clickhouse-client)
    volumes:
      - clickhouse-data:/var/lib/clickhouse
      # *.sql here runs once, on the very first start of an empty data volume.
      - ./clickhouse/initdb:/docker-entrypoint-initdb.d:ro
      # Mounted file-by-file, NOT as a directory: the image ships its own
      # config.d/docker_related_config.xml (which sets listen_host to the wildcard
      # address). Mounting the whole directory shadows it and the server ends up
      # listening on loopback only, unreachable from the Liquibase container.
      - ./clickhouse/config.d/01-keeper.xml:/etc/clickhouse-server/config.d/01-keeper.xml:ro
      - ./clickhouse/config.d/02-clusters.xml:/etc/clickhouse-server/config.d/02-clusters.xml:ro
    ulimits:
      nofile:
        soft: 262144
        hard: 262144
    healthcheck:
      # Probe the HTTP port, not just the native one. With Keeper enabled 8123 comes up
      # noticeably later than 9000, and JDBC talks to 8123 - a native-only check reports
      # healthy while Liquibase still gets "Connection refused".
      # Probes the container's own external address, not localhost, and on purpose:
      # the entrypoint runs a temporary init server bound to loopback while it executes
      # docker-entrypoint-initdb.d, so a localhost probe reports healthy before the real
      # server exists. JDBC also needs 8123, which comes up later than native 9000.
      test: ["CMD-SHELL", "wget -qO- http://$(hostname):8123/ping | grep -q Ok && clickhouse-client --user ${CLICKHOUSE_USER:-liquibase} --password ${CLICKHOUSE_PASSWORD:-liquibase} --query 'SELECT 1'"]
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 20s

  liquibase:
    # Consumed by tag, never built from here - the Dockerfile lives in ./image, which
    # stands in for a separate repository. `task image:build` produces this tag locally;
    # in the real split you would `docker pull` it from a registry.
    image: public.ecr.aws/a8c0b5z6/liquibase-clickhouse:4.33.0-1
    container_name: liquibase
    depends_on:
      clickhouse:
        condition: service_healthy
    environment:
      # Credentials only. Environment variables outrank the defaults file in Liquibase's
      # precedence order, so anything set here silently wins over liquibase.properties -
      # keep that to values that must not be committed. The JDBC URL deliberately lives
      # in migrations/liquibase.properties instead, where it is reviewable in git.
      LIQUIBASE_COMMAND_USERNAME: ${CLICKHOUSE_USER:-liquibase}
      LIQUIBASE_COMMAND_PASSWORD: ${CLICKHOUSE_PASSWORD:-liquibase}
    volumes:
      - ./migrations/changelog:/liquibase/changelog
      # The image entrypoint always injects --defaultsFile=/liquibase/liquibase.docker.properties,
      # so that is the path our config has to land on.
      - ./migrations/liquibase.properties:/liquibase/liquibase.docker.properties:ro
      # NOTE: migrations/liquibaseClickhouse.conf is deliberately NOT mounted here.
      # Mounting it switches the extension into cluster mode, which is broken in this
      # combination - see `task demo-cluster-mode` and the README.
      # generate-changelog / diff-changelog write here
      - ./migrations/out:/liquibase/out
    working_dir: /liquibase
    # One-shot CLI container: `docker compose run --rm liquibase <command>`
    profiles: ["cli"]

volumes:
  clickhouse-data:
